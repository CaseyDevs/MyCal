name: MyCal checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: mycal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: mycal
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: mycal
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U mycal -d mycal"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build MyCal.sln -m:1
      - name: Verify calculations, migrations, and account security
        run: dotnet MyCal.Tests/bin/Debug/net10.0/MyCal.Tests.dll --report-trx --results-directory .local/test-results
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-test-results
          path: .local/test-results/*.trx
          retention-days: 7
          include-hidden-files: true
